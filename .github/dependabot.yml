version: 2

multi-ecosystem-groups:
  all-deps:
    schedule:
      interval: cron
      cronjob: "0 9 1,15 * *"
      timezone: UTC
    open-pull-requests-limit: 10

updates:
  - package-ecosystem: cargo
    directory: "/rust"
    multi-ecosystem-group: all-deps
    patterns: ["*"]
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch

  - package-ecosystem: npm
    directory: "/typescript"
    multi-ecosystem-group: all-deps
    patterns: ["*"]
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch

  - package-ecosystem: pip
    directory: "/python"
    multi-ecosystem-group: all-deps
    patterns: ["*"]
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch

  - package-ecosystem: github-actions
    directory: "/"
    multi-ecosystem-group: all-deps
    patterns: ["*"]
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
