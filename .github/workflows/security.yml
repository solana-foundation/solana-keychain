name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: >
          cargo audit
          --ignore RUSTSEC-2024-0344
          --ignore RUSTSEC-2022-0093
          --ignore RUSTSEC-2023-0071
          --ignore RUSTSEC-2026-0104
          --ignore RUSTSEC-2026-0098
          --ignore RUSTSEC-2026-0099
          --ignore RUSTSEC-2026-0097

  pnpm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v6.0.7
        with:
          version: 10.14.0
      - run: pnpm audit

  miri:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/org.rust-lang.miri
          key: miri-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
      - run: cargo +nightly miri setup
      - run: cargo +nightly miri test --locked --lib error::tests
      - run: cargo +nightly miri test --locked --lib http_client_config::tests
      - run: cargo +nightly miri test --locked --lib memory::keypair_util::tests::test_from_json_keypair
