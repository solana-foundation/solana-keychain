name: Publish TypeScript Packages (Manual)

on:
  workflow_dispatch:
    inputs:
      publish-to-npm:
        description: 'Publish to npm registry'
        required: true
        default: true
        type: boolean
      create-github-release:
        description: 'Create GitHub release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write
  pull-requests: write

# Prevent concurrent publishes
concurrency:
  group: keychain-publish
  cancel-in-progress: false

env:
  # Packages to publish in dependency order (core first, umbrella last)
  PUBLISH_PACKAGES: |
    core
    aws-kms
    fireblocks
    privy
    turnkey
    vault
    keychain

jobs:
  publish:
    name: Publish @solana/keychain-* packages
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_PROVENANCE: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        working-directory: typescript
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: typescript
        run: pnpm install --frozen-lockfile

      - name: Get version and check consistency
        id: version
        working-directory: typescript
        run: |
          # Get version from umbrella package
          VERSION=$(node -p "require('./packages/keychain/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Target version: $VERSION"
          
          # Check that all publishable packages have the same version
          echo "🔍 Checking version consistency across packages..."
          
          PACKAGES="core aws-kms fireblocks privy turnkey vault keychain"
          for pkg in $PACKAGES; do
            PKG_VERSION=$(node -p "require('./packages/${pkg}/package.json').version")
            if [ "$PKG_VERSION" != "$VERSION" ]; then
              echo "❌ Version mismatch: packages/${pkg} has version ${PKG_VERSION}, expected ${VERSION}"
              exit 1
            fi
            echo "  ✓ packages/${pkg}: ${PKG_VERSION}"
          done
          
          echo "✅ All packages have version $VERSION"

      - name: Build all packages
        working-directory: typescript
        run: pnpm build

      - name: Run type check
        working-directory: typescript
        run: pnpm typecheck

      - name: Pack all packages
        working-directory: typescript
        run: |
          echo "📦 Packing all publishable packages..."
          
          # Create output directory for tarballs
          mkdir -p .npm-pack
          
          # Use pnpm pack (not npm pack) to ensure workspace:* is resolved to real versions
          PACKAGES="core aws-kms fireblocks privy turnkey vault keychain"
          for pkg in $PACKAGES; do
            echo "  Packing packages/${pkg}..."
            cd packages/${pkg}
            pnpm pack --pack-destination ../../.npm-pack
            cd ../..
          done
          
          echo ""
          echo "📦 Packed tarballs:"
          ls -la .npm-pack/

      - name: "Guard - Fail if tarballs contain workspace: protocol"
        working-directory: typescript
        run: |
          echo "🔍 Checking tarballs for workspace: protocol..."
          
          FAILED=0
          for tarball in .npm-pack/*.tgz; do
            echo "  Checking ${tarball}..."
            
            # Extract package.json from tarball
            tar -xzf "$tarball" package/package.json -O > /tmp/pkg.json
            
            # Check for workspace: in dependencies
            if grep -q '"workspace:' /tmp/pkg.json; then
              echo "❌ FAIL: ${tarball} contains workspace: dependencies!"
              echo "    Found:"
              grep '"workspace:' /tmp/pkg.json || true
              FAILED=1
            else
              echo "    ✓ No workspace: dependencies found"
            fi
          done
          
          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "❌ One or more tarballs contain workspace: dependencies."
            echo "   This indicates npm pack did not resolve workspace dependencies."
            echo "   Check that pnpm is being used correctly or dependencies are specified with semver ranges."
            exit 1
          fi
          
          echo ""
          echo "✅ All tarballs are clean (no workspace: dependencies)"

      - name: Guard - Fail if tarballs are missing dist/ artifacts
        working-directory: typescript
        run: |
          echo "🔍 Checking tarballs for dist/ artifacts..."
          
          FAILED=0
          for tarball in .npm-pack/*.tgz; do
            echo "  Checking ${tarball}..."
            
            # List tarball contents and check for dist/
            CONTENTS=$(tar -tzf "$tarball")
            
            if ! echo "$CONTENTS" | grep -q "package/dist/index.js"; then
              echo "❌ FAIL: ${tarball} is missing dist/index.js!"
              FAILED=1
            fi
            
            if ! echo "$CONTENTS" | grep -q "package/dist/index.d.ts"; then
              echo "❌ FAIL: ${tarball} is missing dist/index.d.ts!"
              FAILED=1
            fi
            
            if [ "$FAILED" -eq 0 ]; then
              echo "    ✓ dist/index.js and dist/index.d.ts present"
            fi
          done
          
          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "❌ One or more tarballs are missing required dist/ artifacts."
            echo "   Make sure 'pnpm build' ran successfully before packing."
            exit 1
          fi
          
          echo ""
          echo "✅ All tarballs contain required dist/ artifacts"

      - name: Publish to npm
        if: ${{ github.event.inputs.publish-to-npm == 'true' }}
        working-directory: typescript
        run: |
          echo "📦 Publishing all packages to npm..."
          
          # Publish order: core first, then signers, then umbrella last
          TARBALLS=(
            ".npm-pack/solana-keychain-core-${{ steps.version.outputs.version }}.tgz"
            ".npm-pack/solana-keychain-aws-kms-${{ steps.version.outputs.version }}.tgz"
            ".npm-pack/solana-keychain-fireblocks-${{ steps.version.outputs.version }}.tgz"
            ".npm-pack/solana-keychain-privy-${{ steps.version.outputs.version }}.tgz"
            ".npm-pack/solana-keychain-turnkey-${{ steps.version.outputs.version }}.tgz"
            ".npm-pack/solana-keychain-vault-${{ steps.version.outputs.version }}.tgz"
            ".npm-pack/solana-keychain-${{ steps.version.outputs.version }}.tgz"
          )
          
          PUBLISHED=()
          for tarball in "${TARBALLS[@]}"; do
            if [ -f "$tarball" ]; then
              echo ""
              echo "📤 Publishing ${tarball}..."
              npm publish "$tarball" --access public
              PUBLISHED+=("$tarball")
            else
              echo "⚠️  Tarball not found: ${tarball}"
              echo "   Looking for alternatives..."
              ls -la .npm-pack/ | grep -i "$(basename "$tarball" .tgz)" || true
            fi
          done
          
          echo ""
          echo "✅ Published ${#PUBLISHED[@]} packages successfully"

      - name: Create and push tag
        run: |
          git tag "ts-keychain-v${{ steps.version.outputs.version }}"
          git push origin "ts-keychain-v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        if: ${{ github.event.inputs.create-github-release == 'true' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tagName = `ts-keychain-v${{ steps.version.outputs.version }}`;
            const version = `${{ steps.version.outputs.version }}`;
            const releaseName = `@solana/keychain v${version}`;
            
            const packages = [
              '@solana/keychain-core',
              '@solana/keychain-aws-kms',
              '@solana/keychain-fireblocks',
              '@solana/keychain-privy',
              '@solana/keychain-turnkey',
              '@solana/keychain-vault',
              '@solana/keychain'
            ];
            
            const packageList = packages.map(p => `- \`${p}@${version}\``).join('\n');
            
            const body = `## TypeScript Packages v${version}

            This release includes the following packages:

            ${packageList}

            ### Installation

            \`\`\`bash
            # Install the umbrella package (includes all signers)
            pnpm add @solana/keychain

            # Or install individual packages
            pnpm add @solana/keychain-core
            pnpm add @solana/keychain-privy
            # etc.
            \`\`\`
            `;

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: releaseName,
              body: body.trim(),
              draft: false,
              prerelease: false,
            });

            console.log(`✅ Created release: ${releaseName}`);

      - name: Publish summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🎉 TypeScript Packages Published
          
          **Version**: \`${VERSION}\`
          **Tag**: \`ts-keychain-v${VERSION}\`
          
          ### Published Packages
          
          | Package | npm |
          |---------|-----|
          | \`@solana/keychain-core\` | [npm](https://www.npmjs.com/package/@solana/keychain-core/v/${VERSION}) |
          | \`@solana/keychain-aws-kms\` | [npm](https://www.npmjs.com/package/@solana/keychain-aws-kms/v/${VERSION}) |
          | \`@solana/keychain-fireblocks\` | [npm](https://www.npmjs.com/package/@solana/keychain-fireblocks/v/${VERSION}) |
          | \`@solana/keychain-privy\` | [npm](https://www.npmjs.com/package/@solana/keychain-privy/v/${VERSION}) |
          | \`@solana/keychain-turnkey\` | [npm](https://www.npmjs.com/package/@solana/keychain-turnkey/v/${VERSION}) |
          | \`@solana/keychain-vault\` | [npm](https://www.npmjs.com/package/@solana/keychain-vault/v/${VERSION}) |
          | \`@solana/keychain\` | [npm](https://www.npmjs.com/package/@solana/keychain/v/${VERSION}) |
          
          EOF
          
          if [ "${{ github.event.inputs.publish-to-npm }}" == "true" ]; then
            echo "✅ **Published to npm**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ **Skipped npm publish** (dry run)" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ github.event.inputs.create-github-release }}" == "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **GitHub release created**: https://github.com/${{ github.repository }}/releases/tag/ts-keychain-v${VERSION}" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⏭️ **Skipped GitHub release creation**" >> $GITHUB_STEP_SUMMARY
          fi
