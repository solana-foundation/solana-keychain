name: Audit Fix

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: audit-fix
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: taiki-e/install-action@5ebac0d9522d786674368e47e92963ba13f2c376 # v2.82.11
        with:
          tool: cargo-audit
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0

      - name: Override vulnerable pnpm packages
        working-directory: typescript
        run: |
          pnpm audit --fix=override || true
          pnpm install --lockfile-only

      - name: Update vulnerable crates
        working-directory: rust
        run: |
          cargo audit --json \
            | jq -r '.vulnerabilities.list[].package | "\(.name)@\(.version)"' \
            | sort -u \
            | xargs -r -n1 cargo update -p

      - name: Verify audits pass
        run: |
          (cd typescript && pnpm audit)
          (cd rust && cargo audit)

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: fix/audit-advisories
          delete-branch: true
          sign-commits: true
          commit-message: 'fix(deps): resolve pnpm and cargo audit advisories'
          title: 'fix(deps): resolve pnpm and cargo audit advisories'
          body: |
            Automated by the `Audit Fix` workflow: `pnpm audit --fix=override` in `typescript/` and `cargo update -p` for vulnerable crates in `rust/`, then the audits re-run clean.

            Approve the pending workflow runs to start CI, and review forced overrides for major-version jumps before merging.
