[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solana-keychain"
version = "0.1.0"
description = "Unified SolanaSigner interface across key-management backends"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Solana Foundation" }]
keywords = ["solana", "signer", "keychain", "ed25519"]
dependencies = ["httpx>=0.27", "solders>=0.26,<1"]

[project.urls]
Repository = "https://github.com/solana-foundation/solana-keychain"

[project.optional-dependencies]
aws-kms = ["boto3>=1.35"]
gcp-kms = ["google-cloud-kms>=2.24"]
dev = [
    "boto3>=1.35",
    "build>=1.2",
    "google-cloud-kms>=2.24",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/solana_keychain"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP", "W"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "google.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.test_gcp_kms_signer"]
disallow_untyped_calls = false
