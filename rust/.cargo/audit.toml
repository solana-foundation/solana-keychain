[advisories]
ignore = [
    # curve25519-dalek 3.x comes from the Solana/litesvm stack.
    "RUSTSEC-2024-0344",
    # ed25519-dalek 1.x comes from the Solana/litesvm stack.
    "RUSTSEC-2022-0093",
    # rsa has no patched release; a direct dependency of `dfns` and reached via jsonwebtoken.
    "RUSTSEC-2023-0071",
    # crypto-bigint 0.5.x has no patched release and is pinned by elliptic-curve 0.13. It
    # reaches the P-256 API-key signing of Privy, Turnkey, Dfns and Fordefi (p256 0.13) and
    # the ES256 JWTs of CDP and Openfort (jsonwebtoken 11 still pins p256 0.13), plus k256
    # via solana-sdk. The fix landed in 0.7.6, which needs elliptic-curve 0.14.
    "RUSTSEC-2026-0387",
]
