[package]
name = "solana-keychain"
version = "2.0.0-beta.1"
edition = "2021"
license = "MIT"
description = "Framework-agnostic Solana signing abstractions"
repository = "https://github.com/solana-foundation/solana-keychain"
keywords = ["solana", "blockchain", "signer", "wallet", "crypto"]

[features]
default = ["memory", "sdk-v2"]

# Signer backends
memory = []
vault = ["dep:reqwest", "_remote"]
privy = ["dep:reqwest", "dep:p256", "_remote"]
turnkey = ["dep:reqwest", "dep:p256", "dep:hex", "dep:chrono", "_remote"]
aws_kms = ["dep:aws-sdk-kms", "dep:aws-config", "dep:aws-smithy-http-client", "dep:reqwest"]
fireblocks = [
    "dep:reqwest",
    "dep:jsonwebtoken",
    "dep:sha2",
    "dep:uuid",
    "dep:hex",
    "dep:chrono",
    "dep:tokio",
    "_remote",
]
para = ["dep:reqwest", "dep:hex", "dep:tokio", "_remote"]
crossmint = ["dep:reqwest", "dep:hkdf", "dep:sha2", "dep:ed25519-dalek", "dep:tokio", "_remote"]
gcp_kms = ["dep:google-cloud-kms-v1", "dep:google-cloud-auth", "dep:rustls", "dep:reqwest"]
cdp = [
    "dep:reqwest",
    "dep:jsonwebtoken",
    "dep:uuid",
    "dep:chrono",
    "dep:sha2",
    "dep:hex",
    "_remote",
]
dfns = ["dep:reqwest", "dep:hex", "dep:ed25519-dalek", "dep:p256", "dep:sha2", "dep:rsa", "_remote"]
openfort = [
    "dep:reqwest",
    "dep:jsonwebtoken",
    "dep:uuid",
    "dep:chrono",
    "dep:sha2",
    "dep:hex",
    "_remote",
]
utila = ["dep:reqwest", "dep:jsonwebtoken", "dep:chrono", "dep:tokio", "_remote"]
fordefi = ["dep:reqwest", "dep:p256", "dep:sha2", "dep:tokio", "_remote"]
# Ledger hardware-wallet signing over USB-HID. Local hardware, not HTTP provider,
# so no `_remote`. Works with sdk-v2/v3/v4 without type sharing (raw bytes bridge).
# tokio bridges via spawn_blocking, so pull in tokio's `rt` feature explicitly.
ledger = [
    "dep:solana-remote-wallet",
    "dep:solana-derivation-path",
    "dep:solana-offchain-message",
    "dep:hidapi",
    "dep:tokio",
    "tokio/rt",
]
all = [
    "memory",
    "vault",
    "privy",
    "turnkey",
    "aws_kms",
    "fireblocks",
    "gcp_kms",
    "cdp",
    "para",
    "crossmint",
    "dfns",
    "openfort",
    "utila",
    "fordefi",
]
# NOTE: `ledger` is deliberately omitted from `all` because it pulls hidapi
# (C native HID library requiring platform headers). Would add C toolchain
# requirement to all `--features all` builds; enable explicitly with `--features ledger`.

# Internal marker enabled by every remote (reqwest-based) backend; never
# enable directly.
_remote = []

# SDK version selection (mutually exclusive)
sdk-v2 = ["dep:solana-sdk"]
sdk-v3 = ["dep:solana-sdk-v3", "dep:solana-shred-version-v3", "dep:solana-signature"]
# solana-sdk 4.x bundles solana-signature/solana-shred-version via its `full`
# feature at internally-consistent versions, so no companion-crate pins needed.
sdk-v4 = ["dep:solana-sdk-v4", "dep:wincode"]

# WARNING: DO NOT ENABLE IN PRODUCTION
# This feature logs full API error responses which may contain sensitive information
# Only use for local development/debugging
unsafe-debug = []

# Integration tests (makes actual API calls, requires credentials)
integration-tests = []

[dependencies]
# Solana SDK (version selected by feature flags)
solana-sdk = { version = "2.3.0", optional = true }
solana-sdk-v3 = { package = "solana-sdk", version = "=3.0.0", optional = true }
# Pinned to =3.0.0 to avoid broken transitive deps (solana-signature v3.3 / solana-hash v3 vs v4)
solana-shred-version-v3 = { package = "solana-shred-version", version = "=3.0.0", optional = true }
# Pin solana-signature to avoid v3.3.0 where DecodeError doesn't implement std::error::Error
solana-signature = { version = ">=3.1, <3.5", optional = true }
solana-sdk-v4 = { package = "solana-sdk", version = "=4.0.1", optional = true }

# Ledger hardware wallet (USB-HID). Range deliberately `4` (not pinned): 4.0.x
# lacks Gen5 PIDs (4.1+ has them). Resolves: 3.x consumers -> 4.0.x, 4.x consumers
# -> 4.2.x. Byte bridge (raw bytes) means no type unification with SDK.
# agave-unstable-api is mandatory.
solana-remote-wallet = { version = "4", optional = true, features = ["agave-unstable-api"] }
# DerivationPath type, same version remote-wallet pins.
solana-derivation-path = { version = "3.0.0", optional = true }
# Off-chain message envelope: hardware wallet signs serialized OffchainMessage,
# not raw bytes. Same version as remote-wallet, no extra resolution.
solana-offchain-message = { version = "3.0.0", optional = true }
# Direct HID access for BOLOS dashboard APDUs (not exposed by remote-wallet).
# Used for auto-launch before connect; dashboard speaks different APDUs than
# the Solana app, so enumeration fails with the app closed.
hidapi = { version = "2.6.6", optional = true }

# Core dependencies
async-trait = "0.1.89"
thiserror = "2.0.17"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# Only the polling remote backends (fireblocks, para, crossmint, utila) need
# tokio, and only its timers. Keeping it optional and lean lets runtime-less
# consumers (wasm32-unknown-unknown, mobile FFI) build the memory signer.
tokio = { version = "1.52.3", default-features = false, features = ["time"], optional = true }
log = "0.4.28"
bs58 = "0.5.1"

# Optional dependencies (feature-gated)
reqwest = { version = "0.12.23", optional = true, features = ["json", "rustls-tls"], default-features = false }
p256 = { version = "0.13.2", optional = true, features = ["pem"] }
hex = { version = "0.4.3", optional = true }
chrono = { version = "0.4.42", optional = true }
# default-features off on both drops `default-https-client`, whose only rustls
# provider is aws-lc-rs. The connector is built explicitly in src/aws_kms.
aws-sdk-kms = { version = "1.97.0", optional = true, default-features = false, features = ["rt-tokio"] }
aws-config = { version = "1.1.7", optional = true, default-features = false, features = [
    "rt-tokio",
    "credentials-process",
    "sso",
] }
aws-smithy-http-client = { version = "1.1", optional = true, default-features = false, features = ["rustls-ring"] }
jsonwebtoken = { version = "10.4", optional = true, features = ["rust_crypto"] }
sha2 = { version = "0.10.9", optional = true, features = ["oid"] }
uuid = { version = "1.23", optional = true, features = ["v4"] }
# default-features off drops `default-rustls-provider` and, on google-cloud-auth,
# `default-idtoken-backend`; both pull aws-lc-rs. src/gcp_kms installs ring as the
# process provider instead.
google-cloud-kms-v1 = { version = "1.9.0", optional = true, default-features = false }
google-cloud-auth = { version = "1.4.0", optional = true, default-features = false }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring"] }
ed25519-dalek = { version = "3", optional = true, features = ["pem"] }
hkdf = { version = "0.12", optional = true }
rsa = { version = "0.9", optional = true }

# Core dependencies (used by all signers for transaction serialization)
bincode = "1.3"
# serde cannot express the v1 envelope; wincode can.
wincode = { version = "0.5.5", optional = true }
base64 = "0.22.1"
zeroize = "1.8.2"

# solana-sdk's crypto deps (curve25519-dalek, k256, solana-keypair) sample
# randomness through getrandom 0.2, which refuses to build for browser wasm
# unless the `js` backend is switched on. Target-scoped so native builds are
# untouched.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
# solana-address pulls rand 0.9 → getrandom 0.3, which splits the switch in
# two: this feature makes the js backend *available*, and the final binary
# must still select it with RUSTFLAGS='--cfg getrandom_backend="wasm_js"'.
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
tokio = { version = "1.52", features = ["test-util", "macros", "rt", "rt-multi-thread"] }
wiremock = "0.6"
dotenvy = "0.15.7"
litesvm = "0.7.0"
litesvm-v3 = { package = "litesvm", version = "=0.8.1" }
# Earlier versions pinned solana-pubkey ~4.1, blocking 4.2-line consumers.
# 0.16+ replaced solana-loader-v4-program with -interface, removing that pin.
litesvm-v4 = { package = "litesvm", version = "=0.16.0" }
# Pins the agave-* / solana-*-program cluster to 3.0.11 (last known-good).
# v3.0.14 is partially migrated to solana-hash v4 which causes type mismatches.
# All packages in this cluster have exact cross-version pins, so a single
# agave-feature-set pin cascades the entire cluster.
agave-feature-set-pin = { package = "agave-feature-set", version = "=3.0.11" }
serial_test = "3.3.1"
scoped-env = "2.1"

[profile.dev]
debug = "line-tables-only"

# None of these are imported: they shape resolution or features instead. The two
# solana-* entries pin the sdk-v3 companion crates, agave-feature-set-pin pins the
# litesvm cluster, getrandom is a wasm-only target dependency enabling a backend,
# and google-cloud-auth is the handle that turns its aws-lc-rs defaults off.
[package.metadata.cargo-machete]
ignored = [
    "agave-feature-set-pin",
    "getrandom",
    "google-cloud-auth",
    "solana-shred-version-v3",
    "solana-signature",
]
